service: financial-data-pipeline

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    ALPHA_VANTAGE_API_KEY: ${env:ALPHA_VANTAGE_API_KEY}
    YAHOO_FINANCE_API_KEY: ${env:YAHOO_FINANCE_API_KEY}
    S3_BUCKET: ${env:S3_BUCKET}
    REDSHIFT_CLUSTER: ${env:REDSHIFT_CLUSTER}
    REDSHIFT_DATABASE: ${env:REDSHIFT_DATABASE}
    REDSHIFT_USER: ${env:REDSHIFT_USER}
    REDSHIFT_PASSWORD: ${env:REDSHIFT_PASSWORD}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: arn:aws:s3:::${env:S3_BUCKET}/*
    - Effect: Allow
      Action:
        - redshift-data:ExecuteStatement
        - redshift-data:CancelStatement
        - redshift-data:DescribeStatement
        - redshift-data:GetStatementResult
      Resource: arn:aws:redshift:${env:AWS_REGION, 'us-east-1'}:*:${env:REDSHIFT_CLUSTER}/*
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: arn:aws:logs:${env:AWS_REGION, 'us-east-1'}:*:*

functions:
  dataIngestion:
    handler: src/handlers/ingestion.handler
    description: Ingest financial data from multiple APIs
    timeout: 300
    memorySize: 512
    events:
      - schedule: rate(1 hour)
    environment:
      FUNCTION_NAME: data-ingestion

  dataProcessing:
    handler: src/handlers/processing.handler
    description: Process and normalize financial data
    timeout: 300
    memorySize: 1024
    events:
      - s3:
          bucket: ${env:S3_BUCKET}
          event: s3:ObjectCreated:*
          rules:
            - prefix: raw/
          existing: true
    environment:
      FUNCTION_NAME: data-processing

  dataLoading:
    handler: src/handlers/loading.handler
    description: Load processed data into Redshift
    timeout: 300
    memorySize: 512
    events:
      - s3:
          bucket: ${env:S3_BUCKET}
          event: s3:ObjectCreated:*
          rules:
            - prefix: processed/
          existing: true
    environment:
      FUNCTION_NAME: data-loading

resources:
  Resources:
    DataBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:S3_BUCKET}
        VersioningConfiguration:
          Status: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: ArchiveRawData
              Status: Enabled
              Transitions:
                - TransitionInDays: 30
                  StorageClass: STANDARD_IA
                - TransitionInDays: 90
                  StorageClass: GLACIER

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    layer: true